name: lfe4

profile: lfe4

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  lfe4:
    +schema: raw

models:
  lfe4:
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    staging:
      +materialized: view
      # dbt ne peut pas inférer le schéma des sources read_parquet
      +static_analysis: "off"
    intermediate:
      +materialized: view
    marts:
      +materialized: external

sources:
  lfe4:
    +meta:
      # Racine du lake dlt
      lake_root: >-
        {{ env_var('DBT_LAKE_ROOT') if target.name == 'prod'
           else env_var('DBT_LAKE_ROOT', 's3://lfe4/lake' if target.name == 'dev_s3'
           else env_var('LFE4_DATA_DIR', '../../data') ~ '/dev/lake') }}
