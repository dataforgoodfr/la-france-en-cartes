exclude: |
  (?x)^(
    .*\{\{.*\}\}.*|   # fichiers avec variables cookiecutter
    docs/site/.*      # fichiers compilés mkdocs
  )$

default_install_hook_types:
  - pre-commit
  - pre-push

repos:

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: "🔒 security · Detect hardcoded secrets"

  # Python tools run from the uv dev group, at the versions locked in uv.lock
  - repo: local
    hooks:
      - id: ruff-check
        name: "🐍 python · Lint with Ruff"
        entry: uv run --frozen ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: "🐍 python · Format with Ruff"
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: sqlfluff-fix
        name: "📊 SQL · Fix rule violations"
        entry: uv run --frozen sqlfluff fix --show-lint-violations --processes 0
        language: system
        types: [sql]
        require_serial: true
      - id: sqlfluff-lint
        name: "📊 SQL · Lint SQL code files"
        entry: uv run --frozen sqlfluff lint
        language: system
        types: [sql]
        require_serial: true
        stages: [pre-push]
      - id: pyright
        name: "🐍 python · Check types"
        entry: uv run --frozen pyright
        language: system
        types_or: [python, pyi]
        require_serial: true
        stages: [pre-push]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-workflows
        name: "🐙 github-actions · Validate gh workflow files"
        args: ["--verbose"]
      - id: check-taskfile
        name: "✅ taskfile · Validate Task configuration"

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.0
    hooks:
      - id: uv-lock
        name: "📦 uv · Check lockfile is up to date"

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: "📁 filesystem · Trim trailing whitespace"
      - id: end-of-file-fixer
        name: "📁 filesystem · Fix missing newline at EOF"
      - id: mixed-line-ending
        name: "📁 filesystem · Detect mixed line ending"
      - id: check-yaml
        name: "📁 filesystem · Validate YAML syntax"
      - id: check-toml
        name: "📁 filesystem · Validate TOML syntax"
      - id: check-executables-have-shebangs
        name: "📁 filesystem/⚙️ exec · Verify shebang presence"
      - id: check-shebang-scripts-are-executable
        name: "📁 filesystem/⚙️ exec · Verify script permissions"
      - id: check-case-conflict
        name: "📁 filesystem/📝 names · Check case sensitivity"
      - id: check-illegal-windows-names
        name: "📁 filesystem/📝 names · Validate Windows filenames"
      - id: check-symlinks
        name: "📁 filesystem/🔗 symlink · Check symlink validity"
      - id: destroyed-symlinks
        name: "📁 filesystem/🔗 symlink · Detect broken symlinks"
      - id: check-merge-conflict
        name: "🌳 git · Detect conflict markers"
      - id: forbid-new-submodules
        name: "🌳 git · Prevent submodule creation"
      - id: check-added-large-files
        name: "🌳 git · Block large file commits"
        args: ["--maxkb=1000"]

  - repo: local
    hooks:
      - id: eslint
        name: eslint (webapp)
        entry: bash -c 'cd webapp && npx --no-install eslint --fix --no-warn-ignored "${@#webapp/}"' --
        language: system
        files: ^webapp/.*\.(js|jsx|ts|tsx|mjs)$
