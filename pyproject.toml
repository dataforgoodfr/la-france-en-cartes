[project]
name = "15_la_france_en_cartes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.8",
    "dbt-duckdb>=1.11.0",
    "dlt[filesystem]>=1.31.0",
    "duckdb>=1.1.3",
    "duckdb-engine>=0.15.0",
    "fastexcel>=0.21.0",
    "ipykernel>=6.29.5",
    "ipython>=8.31.0",
    "ipython-sql>=0.5.0",
    "jupysql>=0.10.17",
    "matplotlib>=3.10.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "polars>=2.0.0",
    "pyarrow>=25.0.1",
    "requests>=2.32.3",
    "xlrd>=2.0.2",
]
[tool.pyright]
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "dbt-score>=0.19.0",
    "pyright>=1.1.414",
    "ruff>=0.17.0",
    "sqlfluff>=4.4.0",
    "sqlfluff-templater-dbt>=4.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pipelines"]
