services:
  garage:
    image: dxflrs/garage:v2.5.0
    container_name: garage
    restart: unless-stopped
    ports:
      - "3900:3900"   # S3 API
      - "3901:3901"   # Admin API
      - "3902:3902"   # RPC (internal, can be unexposed for single-node)
    volumes:
      - type: bind
        source: ${PWD}/garage.toml
        target: /etc/garage.toml
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    environment:
      - GARAGE_DEFAULT_BUCKET=lfe4
      - GARAGE_DEFAULT_ACCESS_KEY=garagekeyid
      - GARAGE_DEFAULT_SECRET_KEY=garagesecretchangethis
    command: /garage server --single-node --default-bucket

volumes:
  garage_meta:
  garage_data:

