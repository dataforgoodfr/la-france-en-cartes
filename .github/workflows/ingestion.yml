name: run ingestion

on:
  workflow_call:
    inputs:
      domain:
        type: string
        default: tous

  workflow_dispatch:
    inputs:
      domain:
        type: choice
        options: [tous, sante, agriculture, transverse, education, securite]
        default: tous

permissions:
  contents: read

jobs:
  ingestion-pre-prod:
    strategy:
      fail-fast: false
      matrix:
        domain:  ${{ fromJSON(
          inputs.domain != 'tous'
          && format('["{0}"]', inputs.domain)
          || '["sante","agriculture","transverse","education", "securite"]') }}
    runs-on: ubuntu-24.04
    environment: pre-prod
    timeout-minutes: 15
    concurrency:
      group: ingestion-pre-prod-${{ matrix.domain }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: ingestion ${{ matrix.domain}} sur pre-prod
        run: just ${{ matrix.domain}}_pipeline
        env:
          WORKSPACE__PROFILE: pre_prod
          DESTINATION__FILESYSTEM__BUCKET_URL: ${{ secrets.LAKE_URL }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          DESTINATION__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DESTINATION__FILESYSTEM__CREDENTIALS__ENDPOINT_URL: ${{ vars.ENDPOINT_URL }}
