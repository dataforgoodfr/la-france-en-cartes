name: dbt checks

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: dbt/lfe4/

jobs:
  dbt_checks:

    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Install dbt packages
        run: uv run dbt deps
      - name: Parse dbt
        run: uv run dbt parse
      - name: Score dbt project quality
        run: |
          uv run dbt-score lint
