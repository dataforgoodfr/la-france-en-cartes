name: dbt checks

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: dbt/lfe4/

jobs:
  dbt_checks:

    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Install dbt packages
        run: uv run dbt deps
      - name: Parse dbt
        run: uv run dbt parse
      - name: Score dbt project quality
        run: |
          uv run dbt-score lint
