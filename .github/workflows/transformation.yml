name: transformation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: dbt/lfe4/

jobs:
  transformation:
    environment: pre-prod
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: transformation-pre-prod
      cancel-in-progress: false
    env:
      DBT_TARGET: pre_prod
      DBT_LAKE_ROOT: ${{secrets.LAKE_URL}}
      DBT_EXTERNAL_ROOT: ${{secrets.WAREHOUSE_URL}}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_ENDPOINT: ${{ vars.DUCKDB_S3_ENDPOINT }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Install dbt packages
        run: uv run dbt deps
      - name: Build dbt
        run: uv run dbt build
      - name: Upload DuckDB database
        env:
          DUCKDB_S3_URL: ${{ vars.DUCKDB_S3_URL }}
        run: aws s3 cp lfe4.duckdb "$DUCKDB_S3_URL" --endpoint-url "https://$S3_ENDPOINT"
      - name: Install pmtiles tools
        run: uv tool install geoparquet-io==1.6.0 && uv tool install tippecanoe==2.72.0
      - name: Export marts to PMTiles
        env:
          PMTILES_DEST: ${{ vars.PMTILES_DEST }}
        run: uv run python ../../scripts/marts_to_pmtiles.py target/manifest.json
      - name: Export DuckDB to Postgres
        env:
          PG_URI: ${{ secrets.PG_URI }}
        run: uv run python ../../scripts/duckdb_to_pg.py lfe4.duckdb
